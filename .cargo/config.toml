# Nightly-only settings for the whole workspace.

[build]
# The kernel's target, so build-std knows which target to build `core` for.
# (Without it, nightly Cargo panics when build-std meets per-package-target.)
target = ["aarch64-unknown-none-softfloat"]

[unstable]
# Rebuild core/alloc from source, so they are compiled
# with the same flags as our code (branch protection must match: it is a
# "target modifier"). Needs the rust-src component.
build-std = ["core", "compiler_builtins", "alloc"]
# memcpy, memset & co. for bare metal, from compiler_builtins.
build-std-features = ["compiler-builtins-mem"]

[target.aarch64-unknown-none-softfloat]
# BTI landing pads and PAC-signed return addresses in all kernel code.
# Both use instructions that do nothing until the kernel switches the
# features on, so they are safe to compile in from the start.
rustflags = ["-Zbranch-protection=bti,pac-ret"]
# Boots the kernel in QEMU; used by `cargo kernel` (alias below).
runner = "scripts/run-kernel.sh"

[alias]
# `cargo kernel [-- tcg|kvm]` builds the kernel and boots it in QEMU via the
# runner above.
kernel = ["run", "-p", "kernel", "--target", "aarch64-unknown-none-softfloat"]
