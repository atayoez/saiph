cargo-features = ["per-package-target"]

[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
# Bare-metal ELF that never uses FP/SIMD registers (per-package-target,
# nightly Cargo). Limine loads it; see kernel/linker.ld and limine.conf.
forced-target = "aarch64-unknown-none-softfloat"

[dependencies]
limine = "0.6"
frames = { path = "../frames" }
paging = { path = "../paging" }
# The kernel heap's allocator (see src/heap.rs).
talc = "5.1"
# Spin locks: around the heap, the frame allocator and the page tables.
spin = { version = "0.12", default-features = false, features = ["spin_mutex", "lock_api"] }

[build-dependencies]
# Renders the console font (fonts/) into letter images at build time.
fontdue = "0.9"
