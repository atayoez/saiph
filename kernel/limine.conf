# Limine configuration for the Saiph kernel. Limine looks for this file next
# to its own EFI program first: \EFI\BOOT\limine.conf in QEMU,
# \EFI\saiph\limine.conf on the board (cargo board).

# Boot the first entry straight away, without showing the menu.
timeout: 0

/Saiph
    protocol: limine
    path: boot():/EFI/saiph/kernel
