cargo-features = ["per-package-target"]

[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
# Bare-metal ELF that never uses FP/SIMD registers (per-package-target,
# nightly Cargo). Limine loads it; see kernel/linker.ld and limine.conf.
forced-target = "aarch64-unknown-none-softfloat"

[dependencies]
limine = "0.6"
frames = { path = "../frames" }
paging = { path = "../paging" }
# The kernel heap's allocator (see src/heap.rs).
talc = "5.1"
# The mutex API Saiph's own locks plug into (see src/sync.rs).
lock_api = { version = "0.5", default-features = false }

[build-dependencies]
# Renders the console font (fonts/) into letter images at build time.
fontdue = "0.9"
