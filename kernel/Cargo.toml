cargo-features = ["per-package-target"]

[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
# Bare-metal ELF that never uses FP/SIMD registers (per-package-target,
# nightly Cargo). Limine loads it; see kernel/linker.ld and limine.conf.
forced-target = "aarch64-unknown-none-softfloat"

[dependencies]
limine = "0.6"
frames = { path = "../frames" }
paging = { path = "../paging" }
# Pre-rendered glyphs (one brightness byte per pixel) for text on the screen.
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = ["regular", "size_16", "size_24", "size_32", "unicode-basic-latin"] }
