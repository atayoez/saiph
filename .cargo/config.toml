# Saiph's commands, all through Cargo:
#
#   cargo kernel [tcg|kvm] [words...]   build the kernel and boot it in QEMU;
#                                       the words become its command line
#   cargo board [remove]                boot it once on this machine (the O6),
#                                       or remove it from the ESP again
#   cargo screenshot [file.png]         save what QEMU's screen shows
#   cargo test                          the host-side unit tests
#
# `cargo kernel` is `cargo run -p kernel` with the flags only the kernel
# needs. Cargo builds it, then its runner hook (below) hands the kernel file
# and the remaining words to the `runner` crate in this workspace.

[target.aarch64-unknown-none-softfloat]
runner = ["cargo", "run", "-q", "-p", "runner", "--"]

[alias]
kernel = [
    "run", "-p", "kernel", "--target", "aarch64-unknown-none-softfloat",
    # Rebuild core and alloc from source with the kernel's flags: branch
    # protection is a "target modifier" that all code in one program must
    # agree on, and rustup's prebuilt core has none. (Needs rust-src.)
    "-Zbuild-std=core,compiler_builtins,alloc",
    # memcpy, memset & co. for bare metal, from compiler_builtins.
    "-Zbuild-std-features=compiler-builtins-mem",
    # BTI landing pads and PAC-signed return addresses in every function;
    # they change nothing until the kernel switches the features on. And
    # code for the O6's cores: `cortex-a520` is the smaller of its two core
    # types and has nothing the A720 lacks, so it runs on both. It brings
    # Armv9.2's instructions, such as single-instruction atomics (LSE) and
    # combined authenticate-and-return (`retaa`, so the kernel needs a CPU
    # with PAC, as the O6 and QEMU's `max` and `host` CPUs have).
    # (Only here, not for every build: an IDE's `cargo check` then compiles
    # the kernel against the prebuilt core, and such a kernel leaves PAC and
    # BTI off, see kernel/src/protect.rs.)
    "--config", "target.aarch64-unknown-none-softfloat.rustflags = ['-Zbranch-protection=bti,pac-ret', '-Ctarget-cpu=cortex-a520']",
    "--",
]
board = ["kernel", "board"]
screenshot = ["kernel", "screenshot"]
